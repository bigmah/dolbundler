[package]
name = "gc_controller"
version = "0.1.0"
edition = "2024"

# The read loop runs per report, so build it properly for real use.
# `panic = "abort"` keeps the hot path free of unwind tables.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[build-dependencies]
cc = "1"

[dependencies]
anyhow = "1"
btleplug = "0.11"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
hidapi = "2"
libc = "0.2"
rusb = { version = "0.9", features = ["vendored"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "signal"] }
uuid = "1"
