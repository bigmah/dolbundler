# DolBundler tuning record for GP7E01 (Mario Party 7). Written by hand;
# read by recompios send. See DolBundler/tuning/README.md. KEY=VALUE, shell-safe.
TITLE='Mario Party 7'
TUNED_ON=2026-09-09T01:00:28Z
# All 129 minigames are RELs; compile them alongside the DOL so the phone
# does not interpret their code. This record also invalidates phone modules
# built before the LLVM idle-back-edge fix: DolIR separates the polling load
# and its branch into different blocks, so self-block matching missed them.
# See report.md for measurements of the active Snow Ride race.
REL_DIR='files/dll'
# The address the game loads a REL at, observed by dumping MEM1 mid-minigame
# (MODERNGEKKO_RAM_DUMP) and matching it against the .rel files. Constant across
# the modules checked. A REL's code is relocated against this, so a module built
# for any other address differs from guest RAM and the chassis leaves every one
# of those chunks to the interpreter -- which shows up as smc_lost, not silence.
REL_BASE='0x804DCFA0'
