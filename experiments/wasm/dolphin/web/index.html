<!doctype html>
<meta charset="utf-8">
<title>Dolphin in WebAssembly</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #d7dbe0;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  body { display: flex; flex-direction: column; }
  #stage {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    background: #000; position: relative; min-height: 0;
  }
  canvas {
    max-width: 100%; max-height: 100%; display: block;
    image-rendering: pixelated; touch-action: none;
  }
  #bar {
    flex: 0 0 auto; display: flex; gap: 8px; align-items: center;
    padding: 6px 10px; background: #12161b; border-top: 1px solid #222831;
  }
  button {
    font: inherit; background: #1d232b; color: #d7dbe0;
    border: 1px solid #2c343f; border-radius: 5px; padding: 5px 12px;
  }
  button:disabled { opacity: .45; }
  #status { opacity: .75; }
  #log {
    flex: 0 0 auto; height: 26vh; overflow: auto; margin: 0; padding: 6px 10px;
    background: #0b0d10; border-top: 1px solid #222831; white-space: pre-wrap;
    font-size: 11px; line-height: 1.35;
  }
  #log.hidden { display: none; }

  /* The emulator is 92 MB of WebAssembly and the game streams off the disc
     after that, so there is a long stretch where a phone shows nothing at all.
     Without this the only honest reading of a black screen is "no idea whether
     it is working". */
  #loading {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #000; text-align: center; padding: 0 24px;
  }
  #loading.on { display: flex; }
  #loading-title { font-size: 14px; letter-spacing: .02em; }
  #loading-track {
    width: min(72vw, 340px); height: 6px; background: #1d232b;
    border-radius: 3px; overflow: hidden;
  }
  #loading-fill {
    height: 100%; width: 0; background: #4a90d9; border-radius: 3px;
    transition: width .12s linear;
  }
  /* Some phases have no measurable total -- linking the module, waiting for the
     game to reach a frame -- so the bar sweeps instead of lying about a
     percentage. */
  #loading-fill.sweep {
    width: 32%; transition: none;
    animation: loading-sweep 1.1s ease-in-out infinite;
  }
  @keyframes loading-sweep {
    0% { margin-left: -32%; } 100% { margin-left: 100%; }
  }
  #loading-detail { opacity: .55; font-size: 11px; min-height: 1.4em; }

  /* --- the on-screen pad -------------------------------------------------
     Three clusters, each a box that owns its own area: shoulders, the left
     hand (stick over d-pad) and the face buttons. Everything inside a cluster
     is a percentage of that cluster, so the clusters can be moved and resized
     per orientation without any two controls ever landing on top of each
     other -- which is exactly what the old per-button percentages did on a
     phone held upright.

     iOS Safari refuses screen.orientation.lock, so portrait is not a corner
     case to tolerate: it is how the page is first seen. Portrait puts the
     picture in a band at the top and gives the controls the room underneath;
     landscape has no room to spare, so there the controls go over the
     picture. */
  #pad {
    position: fixed; inset: 0; pointer-events: none; display: none;
    /* vw-limited so the left hand and the face buttons can never grow into
       each other: 42vw + 44vw + two edges still fits the narrowest phone. */
    --stick: min(42vw, 180px);
    --dpad: min(32vw, 132px);
    --face: min(44vw, 196px);
    --edge-x: max(14px, env(safe-area-inset-left), env(safe-area-inset-right));
    --edge-y: max(16px, env(safe-area-inset-bottom));
  }
  body.pad #pad { display: block; }
  body.pad #bar, body.pad #log { display: none; }
  body.pad #stage { position: fixed; inset: 0; }

  .btn {
    position: absolute; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.28);
    background: rgba(255,255,255,.10); color: rgba(255,255,255,.75);
    font: 600 15px/1 ui-monospace, Menlo, monospace; touch-action: none;
  }
  .btn.down { background: rgba(255,255,255,.32); }
  .pill { border-radius: 14px; font-size: 13px; }

  /* shoulders + start: a row that lays itself out, so nothing can collide */
  #shoulders {
    position: absolute; left: 0; right: 0;
    display: flex; gap: 8px; justify-content: center; align-items: center;
    padding: 0 var(--edge-x);
  }
  #shoulders .btn {
    position: relative; flex: 0 1 auto;
    height: 38px; min-width: 52px; padding: 0 10px;
  }
  #shoulders [data-control="5"] { min-width: 78px; }

  /* the left hand: stick with the d-pad under it */
  #hand {
    position: absolute; left: var(--edge-x); bottom: var(--edge-y);
    width: var(--stick); pointer-events: none;
  }
  #stick {
    position: relative; pointer-events: auto;
    width: var(--stick); height: var(--stick);
    border-radius: 50%; border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.06); touch-action: none;
  }
  #knob {
    position: absolute; width: 34%; height: 34%; left: 33%; top: 33%;
    border-radius: 50%; background: rgba(255,255,255,.32);
  }
  #dpad {
    position: relative; width: var(--dpad); height: var(--dpad);
    margin: 14px auto 0;
  }
  #dpad .btn { width: 34%; height: 34%; font-size: 17px; }
  #dpad [data-control="6"] { left: 33%; top: 0; }
  #dpad [data-control="7"] { left: 33%; top: 66%; }
  #dpad [data-control="8"] { left: 0; top: 33%; }
  #dpad [data-control="9"] { left: 66%; top: 33%; }

  /* the face buttons, in the GameCube arrangement: A large in the middle,
     B below-left, X to its right, Y above */
  #face {
    position: absolute; right: var(--edge-x); bottom: var(--edge-y);
    width: var(--face); height: var(--face); pointer-events: none;
  }
  #face [data-control="0"] { left: 28%; top: 34%; width: 40%; height: 40%; font-size: 19px; }
  #face [data-control="1"] { left:  0%; top: 60%; width: 27%; height: 27%; }
  #face [data-control="2"] { left: 71%; top: 22%; width: 27%; height: 27%; }
  #face [data-control="3"] { left: 30%; top:  1%; width: 27%; height: 27%; }

  /* --- portrait: picture on top, controls in the room underneath --------- */
  @media (orientation: portrait) {
    #pad { --picture: min(80vw, 46vh); }
    body.pad #stage {
      top: env(safe-area-inset-top); bottom: auto;
      height: var(--picture);
    }
    #shoulders { top: calc(env(safe-area-inset-top) + var(--picture) + 18px); }
  }

  /* --- landscape: no room to spare, so the controls go over the picture --- */
  @media (orientation: landscape) {
    #pad {
      --stick: min(30vh, 150px);
      --dpad: min(24vh, 118px);
      --face: min(38vh, 180px);
    }
    #shoulders { top: max(10px, env(safe-area-inset-top)); }
  }
</style>

<div id="stage"><canvas id="canvas" width="640" height="528"></canvas>
  <div id="loading">
    <div id="loading-title">Starting</div>
    <div id="loading-track"><div id="loading-fill"></div></div>
    <div id="loading-detail"></div>
  </div>
</div>
<!-- A canvas for the backend's capability probe, and nothing else. A browser
     refuses to transfer a canvas that has ever had a rendering context, and the
     emulation thread has to be handed the real one. -->
<canvas id="dolweb-probe" width="1" height="1" style="display:none"></canvas>

<div id="pad">
  <div id="shoulders">
    <div class="btn pill" data-control="10">L</div>
    <div class="btn pill" data-control="4">Z</div>
    <div class="btn pill" data-control="5">START</div>
    <div class="btn pill" data-control="11">R</div>
  </div>
  <div id="hand">
    <div id="stick"><div id="knob"></div></div>
    <div id="dpad">
      <div class="btn" data-control="6">↑</div>
      <div class="btn" data-control="7">↓</div>
      <div class="btn" data-control="8">←</div>
      <div class="btn" data-control="9">→</div>
    </div>
  </div>
  <div id="face">
    <div class="btn" data-control="0">A</div>
    <div class="btn" data-control="1">B</div>
    <div class="btn" data-control="2">X</div>
    <div class="btn" data-control="3">Y</div>
  </div>
</div>

<div id="bar">
  <button id="start">Start</button>
  <button id="logtoggle">Log</button>
  <span id="status">idle</span>
</div>
<pre id="log"></pre>

<script src="dolweb.js"></script>
<script src="dolweb-page.js"></script>
