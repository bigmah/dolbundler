<!doctype html>
<meta charset="utf-8">
<title>Dolphin in WebAssembly</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #d7dbe0;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  body { display: flex; flex-direction: column; }
  #stage {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    background: #000; position: relative; min-height: 0;
  }
  canvas {
    max-width: 100%; max-height: 100%; display: block;
    image-rendering: pixelated; touch-action: none;
  }
  #bar {
    flex: 0 0 auto; display: flex; gap: 8px; align-items: center;
    padding: 6px 10px; background: #12161b; border-top: 1px solid #222831;
  }
  button {
    font: inherit; background: #1d232b; color: #d7dbe0;
    border: 1px solid #2c343f; border-radius: 5px; padding: 5px 12px;
  }
  button:disabled { opacity: .45; }
  #status { opacity: .75; }
  #log {
    flex: 0 0 auto; height: 26vh; overflow: auto; margin: 0; padding: 6px 10px;
    background: #0b0d10; border-top: 1px solid #222831; white-space: pre-wrap;
    font-size: 11px; line-height: 1.35;
  }
  #log.hidden { display: none; }

  /* --- the on-screen pad -------------------------------------------------
     Only on a touch screen, and only over the picture: a phone has no room
     for a pad beside the game, and a pad that pushes the canvas smaller is
     worse than one drawn on top of it. */
  #pad { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.pad #pad { display: block; }
  body.pad #bar, body.pad #log { display: none; }
  body.pad #stage { position: fixed; inset: 0; }
  .btn {
    position: absolute; pointer-events: auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.28);
    background: rgba(255,255,255,.10); color: rgba(255,255,255,.75);
    font: 600 15px/1 ui-monospace, Menlo, monospace; touch-action: none;
  }
  .btn.down { background: rgba(255,255,255,.32); }
  .pill { border-radius: 14px; font-size: 13px; }
  #stick {
    position: absolute; pointer-events: auto; width: 40vh; height: 40vh;
    max-width: 190px; max-height: 190px;
    left: max(18px, env(safe-area-inset-left)); bottom: 18px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.22);
    background: rgba(255,255,255,.06); touch-action: none;
  }
  #knob {
    position: absolute; width: 34%; height: 34%; left: 33%; top: 33%;
    border-radius: 50%; background: rgba(255,255,255,.32);
  }
</style>

<div id="stage"><canvas id="canvas" width="640" height="528"></canvas></div>
<!-- A canvas for the backend's capability probe, and nothing else. A browser
     refuses to transfer a canvas that has ever had a rendering context, and the
     emulation thread has to be handed the real one. -->
<canvas id="dolweb-probe" width="1" height="1" style="display:none"></canvas>

<div id="pad">
  <div id="stick"><div id="knob"></div></div>
  <div class="btn" data-control="0" style="right:6%;bottom:12%;width:76px;height:76px">A</div>
  <div class="btn" data-control="1" style="right:22%;bottom:8%;width:60px;height:60px">B</div>
  <div class="btn" data-control="2" style="right:8%;bottom:38%;width:52px;height:52px">X</div>
  <div class="btn" data-control="3" style="right:22%;bottom:34%;width:52px;height:52px">Y</div>
  <div class="btn pill" data-control="10" style="left:4%;top:5%;width:78px;height:38px">L</div>
  <div class="btn pill" data-control="11" style="right:4%;top:5%;width:78px;height:38px">R</div>
  <div class="btn pill" data-control="4" style="left:16%;top:5%;width:56px;height:38px">Z</div>
  <div class="btn pill" data-control="5" style="left:50%;top:5%;transform:translateX(-50%);width:88px;height:38px">START</div>
  <div class="btn" data-control="6" style="left:26%;bottom:30%;width:46px;height:46px">↑</div>
  <div class="btn" data-control="7" style="left:26%;bottom:8%;width:46px;height:46px">↓</div>
  <div class="btn" data-control="8" style="left:19%;bottom:19%;width:46px;height:46px">←</div>
  <div class="btn" data-control="9" style="left:33%;bottom:19%;width:46px;height:46px">→</div>
</div>

<div id="bar">
  <button id="start">Start</button>
  <button id="logtoggle">Log</button>
  <span id="status">idle</span>
</div>
<pre id="log"></pre>

<script src="dolweb.js"></script>
<script src="dolweb-page.js"></script>
